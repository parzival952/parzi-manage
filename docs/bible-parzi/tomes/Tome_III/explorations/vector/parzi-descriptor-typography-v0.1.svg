<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Comparaison typographique des descripteurs PARZI</title>
  <desc id="desc">Comparaison des graisses 500, 600 et 700 de la pile système pour Manage et Academy.</desc>
  <defs>
    <g id="wordmark-v02">
      <path fill-rule="evenodd" d="M0 8H19C29 8 35 13 35 22C35 31 29 36 19 36H9V56H0V8ZM9 20L15 16H20L26 20V24L20 28H15L9 24V20Z" />
      <path fill-rule="evenodd" d="M43 56L59 8H70L86 56H76L72 44H57L53 56H43ZM59 36H70L66 20H63L59 36Z" />
      <path fill-rule="evenodd" d="M96 8H115C125 8 131 13 131 22C131 29 127 33 121 35L135 56H124L111 36H105V56H96V8ZM105 20L111 16H116L122 20V24L116 28H111L105 24V20Z" />
      <path d="M143 8H181V17L157 47H181V56H143V47L167 17H143V8Z" />
      <path d="M194 8H214L218 12V16H211V48H218V56H198L194 52V48H201V16H194V8Z" />
    </g>
  </defs>

  <rect width="1200" height="840" fill="#F8F5EF" />
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="72" y="62" fill="#171717" font-size="28" font-weight="700">PARZI — typographie provisoire des descripteurs</text>
    <text x="72" y="94" fill="#666158" font-size="16">Même pile système que l’interface ; aucune nouvelle police ni licence introduite.</text>

    <rect x="72" y="132" width="1056" height="178" rx="16" fill="#FFFFFF" stroke="#D7D2C8" />
    <text x="104" y="176" fill="#666158" font-size="15" font-weight="700">A — MEDIUM 500</text>
    <g transform="translate(188 206)" fill="#171717">
      <g transform="scale(1.25)"><use href="#wordmark-v02" /></g>
      <path d="M306 8V68" stroke="#9B958C" stroke-width="3" />
      <text x="340" y="57" font-size="38" font-weight="500">Manage</text>
      <text x="580" y="57" font-size="38" font-weight="500">Academy</text>
    </g>

    <rect x="72" y="334" width="1056" height="190" rx="16" fill="#FFFFFF" stroke="#B99035" stroke-width="2" />
    <text x="104" y="378" fill="#8E6B22" font-size="15" font-weight="700">B — SEMIBOLD 600 · RECOMMANDÉ</text>
    <g transform="translate(188 414)" fill="#171717">
      <g transform="scale(1.25)"><use href="#wordmark-v02" /></g>
      <path d="M306 8V68" stroke="#9B958C" stroke-width="3" />
      <text x="340" y="57" font-size="38" font-weight="600">Manage</text>
      <text x="580" y="57" font-size="38" font-weight="600">Academy</text>
    </g>

    <rect x="72" y="548" width="1056" height="178" rx="16" fill="#FFFFFF" stroke="#D7D2C8" />
    <text x="104" y="592" fill="#666158" font-size="15" font-weight="700">C — BOLD 700</text>
    <g transform="translate(188 622)" fill="#171717">
      <g transform="scale(1.25)"><use href="#wordmark-v02" /></g>
      <path d="M306 8V68" stroke="#9B958C" stroke-width="3" />
      <text x="340" y="57" font-size="38" font-weight="700">Manage</text>
      <text x="580" y="57" font-size="38" font-weight="700">Academy</text>
    </g>

    <text x="72" y="778" fill="#171717" font-size="16" font-weight="700">Verdict : 600 maintient la lisibilité sans rivaliser avec PARZI.</text>
    <text x="72" y="808" fill="#666158" font-size="14">Choix provisoire documentaire ; la typographie de marque finale reste ouverte.</text>
  </g>
</svg>
