      <text x="480" y="432">VERDICT</text>
      <text x="550" y="432">NOTES</text>
    </g>
    <g fill="#4F4B45" font-size="11">
      <text x="58" y="469">Lockup 60 mm</text>
      <text x="58" y="505">Lockup 40 mm</text>
      <text x="58" y="541">Lockup 25 mm</text>
      <text x="58" y="577">Symbole 12 mm</text>
      <text x="58" y="613">Symbole 8 mm</text>
      <text x="58" y="649">Symbole 6 mm</text>
      <text x="58" y="685">Inversion 60 mm</text>
      <text x="58" y="721">Inversion 40 mm</text>
    </g>

    <rect x="48" y="772" width="697.7" height="116" rx="10" fill="#F5F3EF" stroke="#D7D2C8" />
    <text x="68" y="800" fill="#171717" font-size="15" font-weight="700">3. DISTANCE ET CONDITIONS D’OBSERVATION</text>
    <g fill="#4F4B45" font-size="12">
      <rect x="68" y="820" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="90" y="831">30 cm</text>
      <rect x="156" y="820" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="178" y="831">60 cm</text>
      <rect x="244" y="820" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="266" y="831">1 m</text>
      <text x="330" y="831">Éclairage :</text><path d="M397 835H710" stroke="#9B958C" />
      <text x="68" y="864">Défauts observés :</text><path d="M178 868H710" stroke="#9B958C" />
    </g>

    <rect x="48" y="914" width="697.7" height="154" rx="10" fill="#171717" />
    <text x="68" y="944" fill="#FFFFFF" font-size="15" font-weight="700">4. DÉCISION</text>
    <g fill="#FFFFFF" font-size="12">
      <rect x="68" y="964" width="13" height="13" fill="none" stroke="#FFFFFF" /><text x="90" y="975">PASSE — conserver 40 mm / 8 mm comme minimums</text>
      <rect x="68" y="992" width="13" height="13" fill="none" stroke="#FFFFFF" /><text x="90" y="1003">CONDITIONNEL — relever les minimums à :</text>
      <text x="370" y="1003">lockup</text><path d="M420 1007H465" stroke="#FFFFFF" /><text x="470" y="1003">mm</text>
      <text x="520" y="1003">symbole</text><path d="M580 1007H625" stroke="#FFFFFF" /><text x="630" y="1003">mm</text>
      <rect x="68" y="1020" width="13" height="13" fill="none" stroke="#FFFFFF" /><text x="90" y="1031">REJET — corriger la géométrie avant nouveau test</text>
      <text x="68" y="1054">Signature / validation :</text><path d="M196 1058H480" stroke="#FFFFFF" /><text x="500" y="1054">Date :</text><path d="M540 1058H710" stroke="#FFFFFF" />
    </g>

    <text x="48" y="1104" fill="#666158" font-size="10">Conserver cette fiche avec l’épreuve imprimée ou sa photographie. Aucun résultat ne vaut contrôle juridique ou sélection finale du logo.</text>
  </g>
</svg>
