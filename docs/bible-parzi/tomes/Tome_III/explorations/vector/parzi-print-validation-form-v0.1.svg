    </g>
    <text x="48" y="108" fill="#171717" font-size="24" font-weight="700">Fiche de validation d’impression physique</text>
    <text x="48" y="132" fill="#666158" font-size="12">Prototype interne — Tome III — aucun actif public autorisé</text>

    <rect x="48" y="156" width="697.7" height="174" rx="10" fill="#F5F3EF" stroke="#D7D2C8" />
    <text x="68" y="184" fill="#171717" font-size="15" font-weight="700">1. CONDITIONS DU TEST</text>
    <g fill="#4F4B45" font-size="12">
      <text x="68" y="214">Date :</text><path d="M110 218H260" stroke="#9B958C" />
      <text x="292" y="214">Observateur :</text><path d="M380 218H710" stroke="#9B958C" />
      <text x="68" y="246">Imprimante / modèle :</text><path d="M200 250H710" stroke="#9B958C" />
      <text x="68" y="278">Technologie :</text>
      <rect x="154" y="267" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="176" y="278">Laser</text>
      <rect x="238" y="267" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="260" y="278">Jet d’encre</text>
      <rect x="366" y="267" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="388" y="278">Autre :</text><path d="M435 282H548" stroke="#9B958C" />
      <text x="570" y="278">Papier :</text><path d="M620 282H710" stroke="#9B958C" />
      <text x="68" y="310">Échelle demandée : 100 %</text>
      <text x="274" y="310">Étalon mesuré :</text><path d="M378 314H444" stroke="#9B958C" /><text x="450" y="310">mm</text>
      <rect x="500" y="299" width="13" height="13" fill="#FFFFFF" stroke="#666158" /><text x="522" y="310">Valide (99,5–100,5 mm)</text>
    </g>

    <text x="48" y="370" fill="#171717" font-size="15" font-weight="700">2. OBSERVATION DES SPÉCIMENS</text>
    <text x="48" y="392" fill="#666158" font-size="11">Noter chaque critère : 2 = net, 1 = limite, 0 = échec. Verdict : P = passe, C = conditionnel, R = rejet.</text>

    <g fill="none" stroke="#B9B4AB" stroke-width="1">
      <rect x="48" y="410" width="697.7" height="330" />
      <path d="M48 446H745.7M48 482H745.7M48 518H745.7M48 554H745.7M48 590H745.7M48 626H745.7M48 662H745.7M48 698H745.7" />
      <path d="M168 410V740M238 410V740M308 410V740M390 410V740M470 410V740M540 410V740" />
