<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 793.7 1122.52" role="img" aria-labelledby="title desc">
  <title id="title">Fiche de validation d'impression PARZI v0.1</title>
  <desc id="desc">Formulaire A4 pour consigner les tests laser et jet d'encre du symbole et du lockup PARZI Manage.</desc>
