    <text x="72" y="62" fill="#171717" font-size="28" font-weight="700">PARZI — architecture produit v0.1</text>
    <text x="72" y="94" fill="#666158" font-size="16">Marque mère dominante ; descripteurs provisoires neutres ; aucun territoire couleur appliqué.</text>

