<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 1122.52 793.7" role="img" aria-labelledby="title desc">
  <title id="title">Épreuve d'impression monochrome PARZI Manage v0.1</title>
  <desc id="desc">Planche A4 paysage avec lockups de 60, 40 et 25 millimètres et symboles de 12, 8 et 6 millimètres.</desc>
