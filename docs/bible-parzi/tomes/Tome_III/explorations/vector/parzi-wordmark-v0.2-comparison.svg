  <rect width="1200" height="900" fill="#F8F5EF" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="62" fill="#171717" font-size="28" font-weight="700">PARZI — wordmark v0.2</text>
    <text x="72" y="94" fill="#666158" font-size="16">Une seule variable modifiée : la signature diagonale des contreformes et des terminaisons.</text>

