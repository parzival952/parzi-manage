<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tests de taille du wordmark PARZI v0.2</title>
  <desc id="desc">Comparaison du wordmark à 96, 144 et 218 pixels de large sur fonds clair et sombre.</desc>
  <defs>
    <g id="wordmark-v02">
      <path fill-rule="evenodd" d="M0 8H19C29 8 35 13 35 22C35 31 29 36 19 36H9V56H0V8ZM9 20L15 16H20L26 20V24L20 28H15L9 24V20Z" />
