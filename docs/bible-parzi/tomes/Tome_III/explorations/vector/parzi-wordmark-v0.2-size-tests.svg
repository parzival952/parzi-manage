    <text x="72" y="94" fill="#666158" font-size="16">Largeurs exactes lorsque le SVG est affiché à 100 %.</text>

    <text x="72" y="148" fill="#171717" font-size="20" font-weight="700">Fond clair</text>
    <rect x="72" y="170" width="1056" height="190" rx="16" fill="#FFFFFF" stroke="#D7D2C8" />
    <text x="150" y="218" fill="#666158" font-size="15">96 px de large</text>
    <svg x="150" y="248" width="96" height="28.18" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#171717" /></svg>
    <text x="440" y="218" fill="#666158" font-size="15">144 px de large</text>
    <svg x="440" y="240" width="144" height="42.28" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#171717" /></svg>
    <text x="760" y="218" fill="#666158" font-size="15">218 px de large</text>
    <svg x="760" y="226" width="218" height="64" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#171717" /></svg>

    <text x="72" y="418" fill="#F8F5EF" font-size="20" font-weight="700">Fond sombre</text>
    <rect x="72" y="394" width="1056" height="230" rx="16" fill="#171717" />
    <text x="150" y="478" fill="#BDB6AA" font-size="15">96 px de large</text>
    <svg x="150" y="508" width="96" height="28.18" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#FFFFFF" /></svg>
    <text x="440" y="478" fill="#BDB6AA" font-size="15">144 px de large</text>
    <svg x="440" y="500" width="144" height="42.28" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#FFFFFF" /></svg>
    <text x="760" y="478" fill="#BDB6AA" font-size="15">218 px de large</text>
    <svg x="760" y="486" width="218" height="64" viewBox="0 0 218 64"><use href="#wordmark-v02" fill="#FFFFFF" /></svg>

    <text x="72" y="682" fill="#666158" font-size="15">Prototype documentaire — le symbole reste recommandé sous 96 px de largeur disponible.</text>
